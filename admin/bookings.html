<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site Visits | DC INSTALLATIONS Admin</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="admin.css">
<style>
.adm .adm-sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.adm .adm-cal-ev[aria-pressed=true]{background:var(--orange);color:#000}
.adm .adm-cal-ev-cancel{opacity:.6;text-decoration:line-through;background:#f3f3f3}
.adm .adm-cal-ev-pending{background:#fff9ee;border-left-style:dashed}
.adm .adm-cal-count{font-family:var(--mono);font-size:.8rem;color:var(--grey);margin:0 0 10px}
.adm .adm-detail-ref{font-family:var(--mono);font-weight:700;color:var(--bronze);margin:0 0 12px;font-size:.92rem}
.adm .adm-detail-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.adm .adm-link-btn{background:none;border:0;padding:0;font:inherit;font-family:var(--mono);font-size:.82rem;font-weight:700;color:var(--bronze);text-decoration:underline;cursor:pointer;white-space:nowrap}
.adm .adm-link-btn:hover{color:var(--ink)}
.adm .adm-toolbar .adm-field{flex:1 1 160px}
.adm .adm-toolbar .adm-field-search{flex:2 1 220px}
.adm .adm-cancel-row td{color:#8a8a8a}
.adm .adm-detail a{color:var(--ink);font-weight:700}
.adm .adm-detail a:hover{color:var(--bronze)}
.adm .adm-legend-cancel{display:inline-block;width:18px;height:10px;background:#f3f3f3;border-left:3px solid #999;opacity:.7}
.adm .adm-legend-pending{display:inline-block;width:18px;height:10px;background:#fff9ee;border-left:3px dashed var(--orange)}
.adm .adm-card-head .adm-tabs{margin:0}
</style>
</head>
<body class="adm">
<a class="adm-skip" href="#adm-main">Skip to content</a>
<div class="adm-shell">
  <aside class="adm-side" id="adm-side" aria-label="Admin navigation"></aside>

  <main class="adm-main" id="adm-main">
    <div class="adm-top">
      <div>
        <span class="adm-kicker">// site visits</span>
        <h1>Site Visits</h1>
        <span class="adm-date" id="adm-today"></span>
      </div>
      <div class="adm-actions">
        <button type="button" class="adm-btn adm-btn-ghost" id="adm-goto-today"><svg class="adm-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Today</button>
        <a class="adm-btn adm-btn-dark" href="customers.html"><svg class="adm-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/><circle cx="9" cy="7" r="4"/></svg>Customers</a>
      </div>
    </div>

    <div class="adm-grid adm-grid-4" id="adm-stats" aria-live="polite"></div>

    <section class="adm-card adm-section" aria-labelledby="adm-filter-title">
      <h2 id="adm-filter-title" class="adm-sr">Filter site visits</h2>
      <form class="adm-toolbar" id="adm-filters" novalidate>
        <div class="adm-field adm-field-search">
          <label for="adm-f-q">Search</label>
          <input class="adm-input" id="adm-f-q" type="search" autocomplete="off" aria-describedby="adm-f-q-hint">
          <span class="adm-sr" id="adm-f-q-hint">Customer, reference, site or postcode</span>
        </div>
        <div class="adm-field">
          <label for="adm-f-sector">Service</label>
          <select class="adm-select" id="adm-f-sector"><option value="">All services</option></select>
        </div>
        <div class="adm-field">
          <label for="adm-f-job">Visit type</label>
          <select class="adm-select" id="adm-f-job"><option value="">All visit types</option></select>
        </div>
        <div class="adm-field">
          <label for="adm-f-status">Status</label>
          <select class="adm-select" id="adm-f-status"><option value="">All statuses</option></select>
        </div>
        <div class="adm-field">
          <label for="adm-f-area">Area</label>
          <select class="adm-select" id="adm-f-area"><option value="">All areas</option><option value="Birmingham">Birmingham</option><option value="Wolverhampton">Wolverhampton</option></select>
        </div>
        <button type="reset" class="adm-btn adm-btn-ghost">Clear filters</button>
      </form>
    </section>

    <div class="adm-grid adm-grid-main adm-section">
      <section class="adm-card" aria-labelledby="adm-cal-title">
        <div class="adm-cal-head">
          <button type="button" class="adm-icon-btn" id="adm-prev" aria-label="Previous month"><svg class="adm-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"/></svg></button>
          <h2 id="adm-cal-title" aria-live="polite"></h2>
          <button type="button" class="adm-icon-btn" id="adm-next" aria-label="Next month"><svg class="adm-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <p class="adm-cal-count" id="adm-cal-count"></p>
        <div class="adm-cal" id="adm-cal"></div>
        <div class="adm-legend" id="adm-legend"></div>
      </section>

      <section class="adm-card adm-detail" id="adm-detail" aria-labelledby="adm-detail-title" tabindex="-1"></section>
    </div>

    <div class="adm-msg" id="adm-msg" role="status" aria-live="polite"></div>

    <section class="adm-card adm-section" aria-labelledby="adm-list-title">
      <div class="adm-card-head">
        <h2 id="adm-list-title">Visit list</h2>
        <div class="adm-tabs" role="group" aria-label="List range">
          <button type="button" class="adm-tab" data-scope="month" aria-pressed="true" id="adm-scope-month">Shown month</button>
          <button type="button" class="adm-tab" data-scope="all" aria-pressed="false">All months</button>
        </div>
      </div>
      <div class="adm-table-wrap">
        <table class="adm-table">
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Arrival</th>
              <th scope="col">Reference</th>
              <th scope="col">Customer</th>
              <th scope="col">Service</th>
              <th scope="col">Visit type</th>
              <th scope="col">Property</th>
              <th scope="col">Area</th>
              <th scope="col" class="adm-num">Value</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody id="adm-list"></tbody>
          <tfoot id="adm-list-foot"></tfoot>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="admin.js"></script>
<script>
(function(){
'use strict';
var D=window.ADMIN_DATA,A=window.ADM,L=D.labels,esc=A.esc;
A.renderNav('adm-side');

var today=D.today;
var t0=A.parse(today);
var view=new Date(t0.getFullYear(),t0.getMonth(),1);
var selected=null;
var scope='month';
var f={sector:'',job:'',status:'',area:'',q:''};

var elStats=document.getElementById('adm-stats');
var elCal=document.getElementById('adm-cal');
var elTitle=document.getElementById('adm-cal-title');
var elCount=document.getElementById('adm-cal-count');
var elDet=document.getElementById('adm-detail');
var elList=document.getElementById('adm-list');
var elFoot=document.getElementById('adm-list-foot');
var elMsg=document.getElementById('adm-msg');

document.getElementById('adm-today').textContent=A.fmtDate(today,{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function find(id){for(var i=0;i<D.bookings.length;i++)if(D.bookings[i].id===id)return D.bookings[i];return null;}
function sorted(list){return list.slice().sort(function(a,b){var x=a.date+a.time,y=b.date+b.time;return x<y?-1:x>y?1:0;});}
function valueText(b){if(b.jobType==='survey-quote'&&!b.value)return 'No charge';return A.money(b.value);}

/* Filter options */
(function(){
  var s=document.getElementById('adm-f-sector');
  D.sectors.forEach(function(x){s.insertAdjacentHTML('beforeend','<option value="'+esc(x.key)+'">'+esc(x.name)+'</option>');});
  var j=document.getElementById('adm-f-job');
  Object.keys(L.jobType).forEach(function(k){j.insertAdjacentHTML('beforeend','<option value="'+esc(k)+'">'+esc(L.jobType[k])+'</option>');});
  var st=document.getElementById('adm-f-status');
  Object.keys(L.status).forEach(function(k){st.insertAdjacentHTML('beforeend','<option value="'+esc(k)+'">'+esc(L.status[k])+'</option>');});
  var lg=document.getElementById('adm-legend');
  lg.innerHTML=D.sectors.map(function(x){return '<span><span class="adm-dot" style="background:'+x.color+'"></span>'+esc(x.name)+'</span>';}).join('')+
    '<span><span class="adm-legend-pending" aria-hidden="true"></span>Awaiting confirmation</span>'+
    '<span><span class="adm-legend-cancel" aria-hidden="true"></span>Cancelled</span>';
})();

function match(b){
  if(f.sector&&b.service!==f.sector)return false;
  if(f.job&&b.jobType!==f.job)return false;
  if(f.status&&b.status!==f.status)return false;
  if(f.area&&b.area!==f.area)return false;
  if(f.q){var h=(b.id+' '+b.customer+' '+b.site+' '+b.postcode+' '+b.details).toLowerCase();if(h.indexOf(f.q)<0)return false;}
  return true;
}

/* Headline figures */
function stat(label,value,sub){return '<div class="adm-card adm-stat"><div class="adm-stat-label">'+esc(label)+'</div><div class="adm-stat-value">'+value+'</div><div class="adm-stat-sub">'+sub+'</div></div>';}
function renderStats(){
  var mk=today.slice(0,7);
  var live=D.bookings.filter(function(b){return b.status!=='cancelled';});
  var inMonth=live.filter(function(b){return b.date.slice(0,7)===mk;});
  var done=inMonth.filter(function(b){return b.status==='completed';}).length;
  var todays=sorted(live.filter(function(b){return b.date===today;}));
  var pend=D.bookings.filter(function(b){return b.status==='pending';});
  var pendVal=pend.reduce(function(a,b){return a+b.value;},0);
  var val=inMonth.reduce(function(a,b){return a+b.value;},0);
  var paid=inMonth.filter(function(b){return b.value>0;});
  var upcoming=live.filter(function(b){return b.date>=today&&b.status!=='completed';});
  elStats.innerHTML=
    stat('Visits this month',String(inMonth.length),esc(done+' completed - '+(inMonth.length-done)+' to go'))+
    stat('Visits today',String(todays.length),todays.length?esc(todays.map(function(b){return b.time;}).join(', ')):'None booked')+
    stat('Awaiting confirmation',String(pend.length),esc(A.money(pendVal)+' quoted - '+upcoming.length+' upcoming in total'))+
    stat('Booked value '+A.fmtMonth(mk),A.money(val),esc('Avg '+A.money(paid.length?val/paid.length:0)+' per chargeable visit'));
}

/* Calendar */
function renderCal(){
  var y=view.getFullYear(),m=view.getMonth();
  var mk=ym(view);
  elTitle.textContent=view.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  var monthList=D.bookings.filter(function(b){return b.date.slice(0,7)===mk&&match(b);});
  var live=monthList.filter(function(b){return b.status!=='cancelled';});
  elCount.textContent=live.length+' visits - '+A.money(live.reduce(function(a,b){return a+b.value;},0))+' booked value';
  var offset=(new Date(y,m,1).getDay()+6)%7;
  var days=new Date(y,m+1,0).getDate();
  var cells=Math.ceil((offset+days)/7)*7;
  var html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(d){return '<div class="adm-cal-dow" aria-hidden="true">'+d+'</div>';}).join('');
  for(var i=0;i<cells;i++){
    var d=new Date(y,m,1-offset+i);
    var key=iso(d);
    var inM=d.getMonth()===m;
    var evs=sorted(D.bookings.filter(function(b){return b.date===key&&match(b);}));
    var cls='adm-cal-day'+(inM?'':' adm-cal-out')+(key===today?' adm-cal-today':'');
    html+='<div class="'+cls+'"><span class="adm-cal-num">'+d.getDate()+(key===today?' <span class="adm-sr">(today)</span>':'')+'</span>'+
      evs.map(function(b){
        var s=A.sector(b.service);
        var c='adm-cal-ev'+(b.status==='cancelled'?' adm-cal-ev-cancel':'')+(b.status==='pending'?' adm-cal-ev-pending':'');
        var lab=A.fmtDate(b.date,{weekday:'short',day:'numeric',month:'short'})+', '+b.time+', '+b.customer+', '+s.name+', '+L.status[b.status];
        return '<button type="button" class="'+c+'" style="border-left-color:'+s.color+'" data-id="'+esc(b.id)+'" aria-pressed="'+(b.id===selected?'true':'false')+'" aria-label="'+esc(lab)+'" title="'+esc(lab)+'">'+esc(b.time+' '+b.customer)+'</button>';
      }).join('')+'</div>';
  }
  elCal.innerHTML=html;
}

/* Detail panel */
function row(label,html){return '<dt>'+esc(label)+'</dt><dd>'+html+'</dd>';}
function renderDetail(){
  var b=find(selected);
  if(!b){
    elDet.innerHTML='<h2 id="adm-detail-title">Visit details</h2><p class="adm-muted">Select a visit on the calendar or in the list.</p>';
    return;
  }
  var acts='';
  if(b.status==='pending')acts+='<button type="button" class="adm-btn adm-btn-sm" data-act="confirmed">Confirm visit</button>';
  if(b.status==='confirmed')acts+='<button type="button" class="adm-btn adm-btn-sm" data-act="completed">Mark completed</button>';
  if(b.status==='pending'||b.status==='confirmed')acts+='<button type="button" class="adm-btn adm-btn-danger adm-btn-sm" data-act="cancelled">Cancel visit</button>';
  if(b.status==='cancelled')acts+='<button type="button" class="adm-btn adm-btn-ghost adm-btn-sm" data-act="pending">Reinstate visit</button>';
  if(b.status==='completed')acts+='<button type="button" class="adm-btn adm-btn-ghost adm-btn-sm" data-act="confirmed">Reopen visit</button>';
  elDet.innerHTML='<div class="adm-card-head"><h2 id="adm-detail-title">Visit details</h2>'+A.badge(b.status)+'</div>'+
    '<p class="adm-detail-ref">'+esc(b.id)+'</p>'+
    '<dl>'+
      row('Date',esc(A.fmtDate(b.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})))+
      row('Time window',esc(L.window[b.window]+' - arrival '+b.time))+
      row('Service',A.sectorTag(b.service))+
      row('Visit type',esc(L.jobType[b.jobType]||b.jobType))+
      row('Property type',esc(L.property[b.property]||b.property))+
      row('Job details',esc(b.details))+
      row('Customer','<a href="customers.html">'+esc(b.customer)+'</a>')+
      row('Site',esc(b.site)+'<br>'+esc(b.area+' '+b.postcode))+
      row('Value',esc(valueText(b)))+
    '</dl>'+
    '<div class="adm-detail-actions">'+acts+'</div>';
}

/* List */
function renderList(){
  var mk=ym(view);
  var list=sorted(D.bookings.filter(function(b){return match(b)&&(scope==='all'||b.date.slice(0,7)===mk);}));
  document.getElementById('adm-list-title').textContent=scope==='all'?'Visit list - all months':'Visit list - '+view.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  if(!list.length){
    elList.innerHTML='<tr><td colspan="10" class="adm-muted">No visits match these filters.</td></tr>';
    elFoot.innerHTML='';
    return;
  }
  elList.innerHTML=list.map(function(b){
    var cls='adm-row-btn'+(b.id===selected?' adm-row-active':'')+(b.status==='cancelled'?' adm-cancel-row':'');
    return '<tr class="'+cls+'" data-id="'+esc(b.id)+'">'+
      '<td style="white-space:nowrap">'+esc(A.fmtDate(b.date,{weekday:'short',day:'numeric',month:'short'}))+'</td>'+
      '<td>'+esc(b.time)+'</td>'+
      '<td><button type="button" class="adm-link-btn" data-id="'+esc(b.id)+'" aria-label="Show details for '+esc(b.id)+', '+esc(b.customer)+'">'+esc(b.id)+'</button></td>'+
      '<td>'+esc(b.customer)+'</td>'+
      '<td>'+A.sectorTag(b.service)+'</td>'+
      '<td>'+esc(L.jobType[b.jobType]||b.jobType)+'</td>'+
      '<td>'+esc(L.property[b.property]||b.property)+'</td>'+
      '<td>'+esc(b.area)+'</td>'+
      '<td class="adm-num">'+esc(valueText(b))+'</td>'+
      '<td>'+A.badge(b.status)+'</td></tr>';
  }).join('');
  var live=list.filter(function(b){return b.status!=='cancelled';});
  elFoot.innerHTML='<tr><td colspan="8">'+live.length+' visits'+(list.length>live.length?' ('+(list.length-live.length)+' cancelled)':'')+'</td><td class="adm-num">'+A.money(live.reduce(function(a,b){return a+b.value;},0))+'</td><td></td></tr>';
}

function renderAll(){renderStats();renderCal();renderDetail();renderList();}

function select(id,focusDetail){
  var b=find(id);if(!b)return;
  selected=id;
  var d=A.parse(b.date);
  if(ym(d)!==ym(view))view=new Date(d.getFullYear(),d.getMonth(),1);
  renderCal();renderDetail();renderList();
  if(focusDetail&&window.matchMedia('(max-width:1100px)').matches)elDet.focus();
}

/* Events */
elCal.addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(b)select(b.getAttribute('data-id'),true);});
elList.addEventListener('click',function(e){var tr=e.target.closest('tr[data-id]');if(tr)select(tr.getAttribute('data-id'),true);});
elDet.addEventListener('click',function(e){
  var btn=e.target.closest('[data-act]');if(!btn)return;
  var b=find(selected);if(!b)return;
  var to=btn.getAttribute('data-act');
  b.status=to;
  renderAll();
  A.flash(elMsg,b.id+' - '+b.customer+': '+L.status[to]+'.');
  var first=elDet.querySelector('[data-act]');if(first)first.focus();
});
document.getElementById('adm-prev').addEventListener('click',function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCal();renderList();});
document.getElementById('adm-next').addEventListener('click',function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCal();renderList();});
document.getElementById('adm-goto-today').addEventListener('click',function(){
  view=new Date(t0.getFullYear(),t0.getMonth(),1);
  var first=sorted(D.bookings.filter(function(b){return b.date===today&&b.status!=='cancelled';}))[0];
  if(first)select(first.id,false);else{renderCal();renderList();}
});

var form=document.getElementById('adm-filters');
function readFilters(){
  f.sector=document.getElementById('adm-f-sector').value;
  f.job=document.getElementById('adm-f-job').value;
  f.status=document.getElementById('adm-f-status').value;
  f.area=document.getElementById('adm-f-area').value;
  f.q=document.getElementById('adm-f-q').value.trim().toLowerCase();
  renderCal();renderList();
}
form.addEventListener('input',readFilters);
form.addEventListener('change',readFilters);
form.addEventListener('submit',function(e){e.preventDefault();readFilters();});
form.addEventListener('reset',function(){setTimeout(function(){readFilters();A.flash(elMsg,'Filters cleared.');},0);});

Array.prototype.forEach.call(document.querySelectorAll('[data-scope]'),function(btn){
  btn.addEventListener('click',function(){
    scope=btn.getAttribute('data-scope');
    Array.prototype.forEach.call(document.querySelectorAll('[data-scope]'),function(x){x.setAttribute('aria-pressed',x===btn?'true':'false');});
    renderList();
  });
});

/* Open on today's first visit */
var firstToday=sorted(D.bookings.filter(function(b){return b.date===today&&b.status!=='cancelled';}))[0];
if(firstToday)selected=firstToday.id;
renderAll();
})();
</script>
